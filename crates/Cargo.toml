[workspace]
members = ["cplex-bindings", "compass", "cplex-rs", "cuopt-rs", "cuopt-bindings"]

resolver = "2"

[workspace.dependencies]
anyhow = { version = "1.0" }
bindgen = { version = "0.72" }
regex = { version = "1.11" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
rust_sbml = { version = "0.7", default-features = false }
itertools = { version = "0.13" }
rand = { version = "0.9" }
rand_xoshiro = { version = "0.7" }

# Intra-workspace dependencies
cplex-bindings = { path = "cplex-bindings" }
cuopt-bindings = { path = "cuopt-bindings" }